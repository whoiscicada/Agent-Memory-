[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.0",
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "openai==1.30.5",
    "pinecone-client==3.2.2",
    "weaviate-client==4.6.4",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "tenacity==8.3.0",
    "structlog==24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "respx==0.21.1",
    "faker==25.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
